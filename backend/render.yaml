services:
  - type: web
    name: suze-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "https://suze-frontend.vercel.app,http://localhost:5173"
