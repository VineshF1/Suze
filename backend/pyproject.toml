[project]
name = "suze"
version = "1.0.0"
description = "Secure Agentic RAG Knowledge Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "chromadb>=1.0.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.1.0",
    "rank-bm25>=0.2.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.5",
    "pymupdf>=1.23.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:legacy embedding function config:DeprecationWarning",
]
